apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: desafio
  labels:
    app: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      name: api
      labels:
        app: api
    spec:
      containers:
        - image: postgrest/postgrest
          name: postgrest-api
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGRST_DB_URI
            - name: PGRST_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: PGRST_DB_SCHEMA
            - name: PGRST_DB_ANON_ROLE
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: PGRST_DB_ANON_ROLE
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 3
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 3
            timeoutSeconds: 3
            periodSeconds: 10
