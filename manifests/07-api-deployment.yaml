apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: desafio
  labels:
    app: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      name: api
      labels:
        app: api
    spec:
      containers:
        - image: postgrest/postgrest
          name: postgrest-api
          ports:
            - containerPort: 3000
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGRST_DB_URI
            - name: PGRST_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: PGRST_DB_SCHEMA
            - name: PGRST_DB_ANON_ROLE
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: PGRST_DB_ANON_ROLE
