apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: desafio
  labels:
    app: database
spec:
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      name: database
      labels:
        app: database
    spec:
      containers:
        - image: postgres:16
          name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
      volumes:
        - name: "postgres-storage"
          persistentVolumeClaim:
            claimName: "pv-claim"